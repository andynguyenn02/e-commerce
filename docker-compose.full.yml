# Whole stack in one command: DB + migrations + seed + API + FE + mail.
#
#   docker compose -f docker-compose.full.yml up -d --build
#
# Needs MSSQL_SA_PASSWORD in the repo-root .env (same as docker-compose.yml).
# Uses the same host ports as the dev stack, so stop that one first
# (`docker compose down`). Its data lives in its own volume, separate from dev.
#
#   FE        http://localhost:5173
#   API       http://localhost:5118   (Swagger: /swagger)
#   Mail UI   http://localhost:8025
#   SQL       localhost,1433  (sa / MSSQL_SA_PASSWORD, db EcommerceDb)

name: ecommerce-full

x-connection-string: &connection-string "Server=db,1433;Database=EcommerceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # One-shot: applies EF Core migrations (creates EcommerceDb on first run), then exits.
  migrate:
    build:
      context: .
      dockerfile: ecommerce.Api/Dockerfile
      target: migrator
    environment:
      # The bundle boots the app's host, which requires this setting to exist.
      ConnectionStrings__DefaultConnection: *connection-string
    command: ["--connection", *connection-string]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot: loads seeds/database/seed.sql (idempotent) so the test logins exist:
  #   admin / Admin@123, customer1..3 / Customer@123
  seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./seeds/database:/seed:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -b -S db -U sa -P "$$MSSQL_SA_PASSWORD" -d EcommerceDb -i /seed/seed.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: ecommerce.Api/Dockerfile
      target: api
    environment:
      # Development: enables Swagger UI and picks up the dev Smtp block.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: *connection-string
      Smtp__Host: mailpit
      Smtp__Port: "1025"
    ports:
      - "5118:8080"
    volumes:
      - api-storage:/app/Storage   # uploaded / archived / failed inventory files
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./ecommerce.Web
      args:
        # Called by the browser, so it is the host port of the api service.
        VITE_API_URL: http://localhost:5118
    ports:
      - "5173:80"   # must stay 5173: the API's CORS policy allows only this origin
    depends_on:
      - api
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

volumes:
  db-data:
  api-storage:
