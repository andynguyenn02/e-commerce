apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-storage
  namespace: ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.api.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ecommerce
spec:
  # Stuck at 1: api-storage is ReadWriteOnce (one node can mount it), and
  # inventory uploads are processed by a background worker running inside
  # the api process itself. A second pod would either fail to mount the
  # PVC or process the same upload twice. Scaling out needs object storage
  # (S3/Azure Blob) and moving the worker out of the api pod first.
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: {{.Values.pullSecret}}
      containers:
        - name: api
          # image: ghcr.io/andynguyenn02/ecommerce-api:d710037
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - containerPort: {{.Values.api.port}}
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: JwtSettings__Key
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JwtSettings__Key
          volumeMounts:
            - name: api-storage
              mountPath: /app/Storage
          # Readiness may depend on the db: failing it only pulls this pod
          # out of the Service, which is the right reaction to a DB blip.
          readinessProbe:
            httpGet:
              path: /api/category
              port: {{.Values.api.port}}
            initialDelaySeconds: 10
            periodSeconds: 10
          # Liveness must NOT depend on the db: httpGet here would get every
          # api pod killed and restarted on a brief DB problem, turning a
          # blip into an outage. tcpSocket only checks that Kestrel is up.
          livenessProbe:
            tcpSocket:
              port: {{.Values.api.port}}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12}}
      volumes:
        - name: api-storage
          persistentVolumeClaim:
            claimName: api-storage
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ecommerce
spec:
  selector:
    app: api
  # web's nginx defaults its upstream to api:{{.Values.api.port}}, so this name and port
  # are load-bearing, not arbitrary.
  ports:
    - port: {{.Values.api.port}}
      targetPort: {{.Values.api.port}}
