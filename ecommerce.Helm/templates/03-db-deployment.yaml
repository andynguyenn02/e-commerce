apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: ecommerce
spec:
  replicas: {{ .Values.db.replicas}}
  # db-data is ReadWriteOnce; the default RollingUpdate would start a second
  # pod mounting the same volume on a single node, risking two sqlservr
  # processes writing the data directory at once. Recreate avoids that.
  strategy:
    type: Recreate
  # The Deployment owns every pod carrying these labels, which is why
  # selector.matchLabels must equal template.metadata.labels exactly.
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          # image: mcr.microsoft.com/mssql/server:2022-latest
          image: {{.Values.db.image.repository}}:{{.Values.db.image.tag}}
          ports:
            - containerPort: {{.Values.db.port}}
          env:
            - name: ACCEPT_EULA
              value: "Y"
            # The password never appears in this file: it is read from the
            # app-secrets Secret at pod start.
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/opt/mssql
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1"
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
      # The pod declares which storage is available; the container above
      # says where to mount it. They are linked by the matching name.
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data