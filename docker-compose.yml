services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-dev
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit
    container_name: mailpit-dev
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

  # Frontend only; the API runs on the host (Rider / dotnet run) on :5118.
  # Built static bundle, no hot reload: use `npm run dev` for day-to-day FE work.
  # nginx proxies /api to the host's API via host.docker.internal (API_UPSTREAM
  # below), since there's no "api" service in this compose file — use
  # `npm run dev` (its own Vite proxy targets localhost:5118) instead for FE work.
  web:
    build:
      context: ./ecommerce.Web
    container_name: web-dev
    environment:
      API_UPSTREAM: host.docker.internal:5118
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  sqlserver-data: