apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          # Docker Hub image, not GHCR — no imagePullSecrets needed.
          image: axllent/mailpit
          ports:
            - containerPort: 1025
            - containerPort: 8025
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: ecommerce
spec:
  selector:
    app: mailpit
  # A Service with more than one port must name each one.
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
