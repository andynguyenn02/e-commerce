apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: ecommerce
spec:
  # Same situation as migrate: no depends_on here, so this can race the db
  # and even the migrate Job. Retries paper over it for now; Phase 3 makes
  # this a proper Helm post-install hook ordered after migrate.
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      # Public image, same as the db — no imagePullSecrets needed.
      containers:
        - name: seed
          image: mcr.microsoft.com/mssql/server:2022-latest
          # command overrides the image ENTRYPOINT (like compose's "entrypoint");
          # args is what compose called "command".
          command: ["/bin/bash", "-c"]
          args:
            - /opt/mssql-tools18/bin/sqlcmd -C -b -S db -U sa -P "$MSSQL_SA_PASSWORD" -d EcommerceDb -i /seed/seed.sql
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: seed-sql
              mountPath: /seed
              readOnly: true
      # seed-sql is created by command from seeds/database/seed.sql, not
      # committed here — see k8s/README.md.
      volumes:
        - name: seed-sql
          configMap:
            name: seed-sql
